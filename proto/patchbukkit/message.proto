syntax = "proto3";

package patchbukkit.message;

import "patchbukkit/common/types.proto";

option java_multiple_files = true;
option java_package = "patchbukkit.message";

message SendMessageRequest {
  patchbukkit.common.UUID uuid = 1;
  string message = 2;
  // Adventure JSON (Gson) form of the same message. Carries click/hover
  // interactions that the legacy string cannot. Empty means legacy-only.
  string message_json = 3;
}
